name: "docker-manager"
description: "Perform various operations on Docker containers"
script_path: "examples/docker_manager.py"
endpoint: "docker-manage"
accepts_input: true
input_method: "json"
async: false
input_schema:
  type: object
  properties:
    operation:
      type: string
      description: "Operation: list, inspect, stats"
      default: "list"
    container_id:
      type: string
      description: "Optional container ID for inspect/stats"
  # Example: Make 'operation' required
  # required:
  #   - operation
expected_output:
  success: "boolean"
  message: "string"
  data: "object"