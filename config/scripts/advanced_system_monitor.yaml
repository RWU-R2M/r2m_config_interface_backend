name: "advanced-system-monitor"
description: "Get comprehensive system metrics including network, processes, and disk I/O"
script_path: "examples/advanced_system_monitor.py"
endpoint: "system-advanced"
accepts_input: true
input_method: "json"
async: false
input_schema:
  type: object  # Define as object
  properties:   # Use properties key
    detail_level:
      type: string
      description: "Detail level: basic, standard, or full"
      default: "standard" # Optional: Add a default value
    component:
      type: string
      description: "Component: cpu, memory, disk, network, processes, or all"
      default: "all" # Optional: Add a default value
  # Optional: Define required fields if necessary
  # required:
  #   - detail_level
expected_output:
  success: "boolean"
  message: "string"
  timestamp: "number"
  data: "object"